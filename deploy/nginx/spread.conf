# /etc/nginx/sites-available/spread — replace tracker.example.com with the tracker domain.

# Postback rate limit per client IP; the zone must be declared in the http context.
limit_req_zone $binary_remote_addr zone=spread_postbacks:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tracker.example.com;

    ssl_certificate /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;

    root /var/www/spread/public;
    index index.php;
    charset utf-8;

    # Postbacks only; the redirect /c/ is never limited.
    location ^~ /p/ {
        limit_req zone=spread_postbacks burst=100 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Overwrites any client-sent X-Real-IP so the redirect can trust it.
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
